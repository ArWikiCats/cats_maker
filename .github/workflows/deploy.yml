name: Update Toolforge

on:
    push:
        branches:
            - main

concurrency:
    group: toolforge-deploy
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Deploy on Toolforge
              uses: appleboy/ssh-action@v1.2.4
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  port: 22
                  request_pty: true
                  script_stop: true
                  key: ${{ secrets.KEY }}
                  script: |
                      # Define script
                      SCRIPT_COMMAND="shs/update_cats_maker_new.sh"

                      # Define pip script
                      SCRIPT_COMMAND_PIP="pip install git+https://github.com/ArWikiCats/cats_maker.git -U"

                      become ${{ secrets.TOOL1 }} bash -lc "$SCRIPT_COMMAND"
