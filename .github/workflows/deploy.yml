name: Update Toolforge

on:
    push:
        branches:
            - main

concurrency:
    group: toolforge-deploy
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Deploy to server
              uses: appleboy/ssh-action@v1.2.4
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  port: 22
                  request_pty: true
                  script_stop: true
                  key: ${{ secrets.KEY }}
                  script: |
                      become ${{ secrets.TOOL1 }} bash -lc "shs/update_cats_maker_new.sh"
